name: SAPI CI-CD

on:
  push:
    branches:
      - dev
      - feature
  pull_request:
    branches:
      - dev
      - qa
      - main
      
  workflow_dispatch: 
    inputs:
      environment:
        description: Environment to deploy to
        type: choice
        options:
          - dev
          - qa
          - prod 
        default: dev

jobs:
  pipeline:
    uses: GayathriNuthalapati/common-pipeline-code/.github/workflows/mulesoft-cicd-pipeline.yml@main
    with:
      environment: dev
    secrets: inherit
